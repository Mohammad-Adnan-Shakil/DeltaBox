# DeltaBox Render Deployment Configuration
# This file configures both the Spring Boot backend and Flask ML service for deployment on Render

services:
  # 🚀 Spring Boot Backend Service
  - type: web
    name: deltabox-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false  # Set manually in Render dashboard to the Neon Postgres connection string
      - key: ML_SERVICE_URL
        value: https://deltabox-ml-service.onrender.com
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false  # Set manually in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # Set manually in Render dashboard
      - key: SPRING_PROFILES_ACTIVE
        value: production
      # Explicit PORT matches Render's expectation so it doesn't detect
      # a "new primary port" and restart the deploy mid-boot
      - key: PORT
        value: 8080
    healthCheckPath: /api/health
    autoDeploy: true

  # 🧠 Flask ML Service
  - type: web
    name: deltabox-ml-service
    runtime: python
    plan: free
    buildCommand: |
      cd ml-service
      pip install -r requirements.txt
    startCommand: |
      cd ml-service
      gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --keep-alive 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 5000
      # Models are committed in ml-service/models/ — no download needed
    healthCheckPath: /health
    autoDeploy: true

# 🗄️ PostgreSQL Database
# Environment variables for local development:
# - ML_SERVICE_URL=http://localhost:5000 (for local development)
